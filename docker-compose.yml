services:
  postgres:
    image: postgres:16
    container_name: feastflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: feastflow
      POSTGRES_PASSWORD: feastflow
      POSTGRES_DB: feastflow
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - feastflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feastflow -d feastflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  feastflow_postgres_data:
